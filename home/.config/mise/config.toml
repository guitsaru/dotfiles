# Global toolchains, deliberately unbounded -- this machine should always be
# current and the nightly dev.mise.mise-upgrade agent keeps it that way.
# Projects pin their own versions in their own mise.toml; nothing here is a
# build input.
[tools]
elixir = "latest"
elixir-ls = "latest"
erlang = "latest"
node = "latest"   # not "lts": that resolves two majors back, to 24.x
rust = { version = "stable", components = ["rust-analyzer"] }

# AI CLIs. `latest` for the same reason as the toolchains -- these are tools,
# not build inputs, and a major bump costs nothing. Previously casks (codex,
# claude-code) and a formula (opencode); as tools the version is pinned in git
# and moved by the nightly `mise upgrade` instead of by Homebrew.
claude-code = "latest"
codex = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
"npm:@rynfar/meridian" = { version = "latest", allow_builds = ["@rynfar/meridian"] }
opencode = "latest"

# Single-binary CLIs. As [tools] one declaration covers macOS and Linux, where
# distro packaging is inconsistent -- Debian ships fd as fd-find and bat as
# batcat, Arch calls gh github-cli, and lazygit and starship are not packaged
# at all. Anything needing system integration (ffmpeg, neovim, gnupg, the zsh
# plugins) stays a system package instead; see [bootstrap.packages].
#
# tree-sitter is deliberately absent: neovim depends on it, so the package
# manager installs it either way and a mise copy would just be shadowed.
#
# Tigris publishes an npm package that mise can install directly; its binary is
# named `tigris`.
#
# herdr is here but its brew formula is still installed: it cannot be pruned
# from inside a running herdr session without unlinking the binary that session
# is using. Both are 0.8.2, so there is no skew while both exist.
herdr = "latest"
bat = "latest"
delta = "latest"
eza = "latest"
fd = "latest"
flyctl = "latest"
fzf = "latest"
gh = "latest"
jq = "latest"
lazygit = "latest"
mkcert = "latest"
ripgrep = "latest"
starship = "latest"
"npm:@tigrisdata/cli" = "latest"
zoxide = "latest"

# The AI CLIs above ship several releases a day, and mise's default 24h
# minimum_release_age holds every one of them back for a day -- so `latest`
# resolves a version behind and each resolution logs a WARN. These are the
# tools worth having same-day, so they opt out of the delay; everything else
# above still gets the 24h window to have a bad release pulled. Names must
# match mise's internal tool names, npm: prefix included.
[settings]
minimum_release_age_excludes = [
  "claude-code",
  "codex",
  "npm:@earendil-works/pi-coding-agent",
  "npm:@rynfar/meridian",
  "opencode",
]
