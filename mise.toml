# Machine setup for this repo, applied in one pass by `mise bootstrap`.
# Run it from this directory; see README.md for the cold-start command.
#
# Sources are relative to this file, so the repo works from any path.
# `exec()` in templates and every hook below also run from this directory.

[dotfiles]
# Shell and git
"~/.zshrc"      = "home/.zshrc"
"~/.zshenv"     = "home/.zshenv"
"~/.zprofile"   = "home/.zprofile"
"~/.gitconfig"  = "home/.gitconfig"
"~/.ssh/config" = "home/.ssh/config"

# ~/.config
"~/.config/git/ignore"              = "home/.config/git/ignore"
"~/.config/gh/config.yml"           = "home/.config/gh/config.yml"
"~/.config/ghostty/config"          = "home/.config/ghostty/config"
"~/.config/herdr/config.toml"       = "home/.config/herdr/config.toml"
"~/.config/mise/config.toml"        = "home/.config/mise/config.toml"
"~/.config/opencode/opencode.jsonc" = "home/.config/opencode/opencode.jsonc"
"~/.config/starship.toml"           = "home/.config/starship.toml"
"~/.config/zed/settings.json"       = "home/.config/zed/settings.json"

# The whole nvim directory is one symlink, so lazy.nvim writes lazy-lock.json
# and lazyvim.json straight into the repo -- plugin bumps show up in git status
# with nothing to sync.
"~/.config/nvim" = "home/.config/nvim"

# Claude Code
"~/.claude/CLAUDE.md"                  = "home/.claude/CLAUDE.md"
"~/.claude/keybindings.json"           = "home/.claude/keybindings.json"
"~/.claude/statusline-command.sh"      = "home/.claude/statusline-command.sh"

# settings.json cannot be a symlink: Claude rewrites it in place, and the
# autoMode.environment block it generates is machine-local and must not be
# published. The template shells out to scripts/merge-claude-settings.py,
# which reads the current file and overwrites only the keys we own.
"~/.claude/settings.json" = { source = "home/.claude/settings.json.tmpl", mode = "template" }

# mise installs these itself -- it reads the formulae.brew.sh API, pours bottles
# from ghcr.io and verifies their checksums, so Homebrew is not a prerequisite.
[bootstrap.brew]
# Claim an app already sitting at the cask destination rather than failing.
# Note this does not reliably avoid replacing the bundle: migrating this
# machine's casks off Homebrew rewrote every .app even with adopt set, so
# macOS may drop an app's Privacy & Security grants after a handover or a
# version upgrade. Re-grant in System Settings if an app stops working.
adopt = true

# A curated fresh-setup manifest, NOT a mirror of what is installed. Ad-hoc
# `brew install` for one-off tools is expected and belongs nowhere near this
# list; bootstrap, status and the drift check only ever consider what is
# declared here, so undeclared packages are invisible to them rather than a
# problem.
#
# Two commands break that assumption and should not be run unattended:
#   packages prune  -- DELETES installed packages missing from this list, which
#                      means every ad-hoc install. It removed chezmoi during the
#                      migration; that was safe only because nothing else was
#                      undeclared at the time.
#   packages import -- SWEEPS installed formulae INTO this list, which is the
#                      opposite of curation. Useful to see what you have; review
#                      its output, never accept it wholesale.
[bootstrap.packages]
# Play, record, convert, and stream select audio and video codecs
"brew:ffmpeg" = "latest"
# Mac App Store CLI, required by the mas: entries below
"brew:mas" = "latest"
# GNU Privacy Guard (OpenPGP)
"brew:gnupg" = "latest"
# Polyglot runtime manager (asdf rust clone)
"brew:mise" = "latest"
# Deep clean and optimize your Mac
"brew:mole" = "latest"
# Ambitious Vim-fork focused on extensibility and agility
"brew:neovim" = "latest"
# Libraries for security-enabled client and server applications
"brew:nss" = "latest"
# Image editing and design software
"brew-cask:affinity" = "latest"
# Display management tool
"brew-cask:betterdisplay" = "latest"
# Anthropic's official Claude AI desktop app
"brew-cask:claude" = "latest"
"brew-cask:font-jetbrains-mono-nerd-font" = "latest"
# Terminal emulator that uses platform-native UI and GPU acceleration
"brew-cask:ghostty" = "latest"
# Web browser
"brew-cask:google-chrome" = "latest"
# Tool to prevent the system from going into sleep mode
"brew-cask:keepingyouawake" = "latest"
# App to manage software development and track bugs
"brew-cask:linear" = "latest"
# Host-based application firewall
"brew-cask:little-snitch" = "latest"
# AI coding agent desktop client
"brew-cask:opencode-desktop" = "latest"
# Replacement for Docker Desktop
"brew-cask:orbstack" = "latest"
# App wrapper for Postgres
"brew-cask:postgres-app" = "latest"
# Window snapping tool
"brew-cask:rectangle-pro" = "latest"
# Menu bar app that enables system-wide navigation using side mouse buttons
"brew-cask:sanesidebuttons" = "latest"
# Team communication and collaboration software
"brew-cask:slack" = "latest"
# Mesh VPN based on WireGuard
"brew-cask:tailscale-app" = "latest"
# Multiplayer code editor
"brew-cask:zed" = "latest"
# Video communication and virtual meeting platform
"brew-cask:zoom" = "latest"

# Captured from this machine's current settings. Read out of the live domains
# by hand -- there is no `defaults import` -- so treat the list as incomplete
# until proven otherwise, and check the domain rather than only the friendly
# keys: [bootstrap.macos.trackpad] exposes two keys and covers neither scroll
# direction nor anything else that matters here. There is no `defaults import`, so these are maintained by
# hand; find new ones by diffing `defaults read` before and after changing a
# setting in System Settings.
#
# No post-defaults `killall Dock Finder` hook on purpose: hooks fire on every
# bootstrap, so it would close Finder windows even when nothing changed. mise
# prints a relaunch reminder when it actually writes a default.
# Linux equivalents, for a move to a Linux dev box. Foreign-platform entries
# are reported as "skipped (only available on linux)" on macOS, so one list
# serves both. Names are conventional but UNVERIFIED on a real box -- the first
# Linux bootstrap will surface any that are wrong.
#
# Not listed: mas and mole are macOS-only, and fzf-tab is packaged by no distro
# at all, so it is cloned via [bootstrap.repos] instead.
"apt:zsh" = "latest"
"dnf:zsh" = "latest"
"pacman:zsh" = "latest"
"apt:neovim" = "latest"
"dnf:neovim" = "latest"
"pacman:neovim" = "latest"
"apt:gnupg" = "latest"
"dnf:gnupg2" = "latest"          # Fedora names it gnupg2
"pacman:gnupg" = "latest"
"apt:ffmpeg" = "latest"
"pacman:ffmpeg" = "latest"
# no dnf:ffmpeg -- Fedora ships ffmpeg-free and full ffmpeg needs RPM Fusion,
# which is a repo decision rather than a package name. Add it once verified.

# Mac App Store. IDs come from `mas list`; the iWork apps are the Creator
# Studio versions -- macOS 26 renamed the bundles but kept the classic IDs.
"mas:363738376" = "latest"    # forScore
"mas:361285480" = "latest"    # Keynote (Creator Studio)
"mas:361304891" = "latest"    # Numbers (Creator Studio)
"mas:361309726" = "latest"    # Pages (Creator Studio)
"mas:1615087040" = "latest"   # Logic Pro (Creator Studio)
"mas:6446933691" = "latest"   # Postico
"mas:1480933944" = "latest"   # Vimari

[bootstrap.macos.dock]
autohide = true
show_recents = false
mru_spaces = false

[bootstrap.macos.finder]
preferred_view_style = "list"   # Nlsv

# The friendly `tilesize` key is integer-only, but macOS stores this one as a
# float and strict typing counts a type mismatch as drift. Raw defaults take
# the matching plist type and override the friendly key for the same pair.
[bootstrap.macos.defaults]
# The friendly `tilesize` key is integer-only, but macOS stores this one as a
# float and strict typing counts a type mismatch as drift. Raw defaults take
# the matching plist type and override the friendly key for the same pair.
"com.apple.dock" = { tilesize = 64.0 }

[bootstrap.macos.defaults.NSGlobalDomain]
# Natural scrolling off. [bootstrap.macos.trackpad] does not expose this -- it
# covers only tap_to_click and three_finger_drag -- and it belongs in the global
# domain anyway, since it applies to the mouse as well as the trackpad.
"com.apple.swipescrolldirection" = false

AppleInterfaceStyle = "Dark"
AppleMiniaturizeOnDoubleClick = false

# Metric and 24-hour, against what the en_US locale would otherwise pick.
AppleICUForce24HourTime = true
AppleICUForce12HourTime = false
AppleMeasurementUnits = "Centimeters"
AppleMetricUnits = true
AppleTemperatureUnit = "Celsius"

# Nightly `brew upgrade`. This is the only thing that upgrades ad-hoc brew
# installs -- `packages upgrade` only touches what [bootstrap.packages]
# declares -- and it works on kegs mise poured, since mise writes
# brew-compatible receipts.
#
# --formula on purpose. Upgrading a cask replaces its .app bundle, and macOS
# may revoke that app's Privacy & Security grants when it does; the cask
# handover in this repo's history did exactly that. Casks stay manual.
[bootstrap.macos.launchd.agents.brew-upgrade]
program = "/opt/homebrew/bin/brew"
args = ["upgrade", "--formula"]
start_calendar_interval = { hour = 3, minute = 0 }
environment = { PATH = "/opt/homebrew/bin:/opt/homebrew/sbin:/usr/bin:/bin:/usr/sbin:/sbin" }
stdout_path = "~/Library/Logs/brew-upgrade.log"
stderr_path = "~/Library/Logs/brew-upgrade.err.log"

# Nightly `mise upgrade`. The global toolchains are unbounded on purpose, so
# this is what keeps them current; projects pin their own versions and are
# unaffected. Offset from brew-upgrade so the two do not contend.
#
# Asleep at 03:30 is fine: launchd runs a missed StartCalendarInterval job on
# the next wake, and coalesces multiple missed intervals into a single run.
[bootstrap.macos.launchd.agents.mise-upgrade]
program = "/opt/homebrew/bin/mise"
args = ["upgrade", "--yes"]
start_calendar_interval = { hour = 3, minute = 30 }
environment = { PATH = "/opt/homebrew/bin:/opt/homebrew/sbin:/usr/bin:/bin:/usr/sbin:/sbin" }
stdout_path = "~/Library/Logs/mise-upgrade.log"
stderr_path = "~/Library/Logs/mise-upgrade.err.log"

# Apple's /bin/zsh, deliberately -- not a Homebrew or mise zsh. This is already
# the login shell on macOS, so applying it is a no-op; it is declared so a
# machine that comes up on something else converges. An absolute path is
# required, and Linux puts zsh at /usr/bin/zsh, so a Linux box needs its own
# value rather than inheriting this one.
# zsh plugins as checkouts rather than packages, so the source paths are the
# same on every platform. fzf-tab is packaged by no distro at all, and
# zsh-autosuggestions lands at a different path on each one
# (/usr/share/zsh-autosuggestions vs /usr/share/zsh/plugins/...), which .zshrc
# would otherwise have to probe for.
#
# Both are public upstreams cloned over https, so this needs no SSH key and
# leaks nothing -- unlike declaring private work repos here would.
[bootstrap.repos]
"~/.local/share/zsh/fzf-tab" = { url = "https://github.com/Aloxaf/fzf-tab.git" }
"~/.local/share/zsh/zsh-autosuggestions" = { url = "https://github.com/zsh-users/zsh-autosuggestions.git" }

[bootstrap.user]
login_shell = "/bin/zsh"

[bootstrap.hooks]
# git records only the executable bit, so 0600 cannot survive a clone the way
# chezmoi's private_ prefix encoded it. Symlinked targets chmod through to the
# repo file; the template-rendered one is a real file.
#
# The rendered settings.json takes its mode from the template file, so that
# gets chmodded too -- otherwise mise sees permanent drift and re-renders on
# every run.
post-dotfiles = [
  'mkdir -p ~/.ssh && chmod 700 ~/.ssh',
  'chmod 600 ~/.ssh/config ~/.config/gh/config.yml ~/.config/zed/settings.json ~/.claude/settings.json',
  'chmod 600 home/.claude/settings.json.tmpl',
]

# Runs after [tools] are installed. Keep idempotent -- it runs every bootstrap.
[tasks.bootstrap]
description = "Install herdr plugins"
run = """
command -v herdr >/dev/null || exit 0
herdr plugin list | grep -q '(herdr-lazygit)' || herdr plugin install crokily/herdr-lazygit --ref v0.3.0 --yes
herdr plugin list | grep -q '(herdr-nvim)'    || herdr plugin install ChmaraX/herdr-nvim --ref v0.2.1 --yes

# Agent integrations. herdr owns these files -- they carry a "managed by herdr"
# header and are overwritten on update -- so the intent is declared here rather
# than tracking the generated file in [dotfiles].
for a in claude codex opencode; do
  herdr integration status | grep -q "^$a: current" || herdr integration install "$a"
done
"""
